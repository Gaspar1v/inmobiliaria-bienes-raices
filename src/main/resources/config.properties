# =====================================================================
# Configuracion del portal. Cada clave puede reemplazarse con una variable
# de entorno: db.url -> BR_DB_URL, db.user -> BR_DB_USER,
# db.password -> BR_DB_PASSWORD, db.inicializar -> BR_DB_INICIALIZAR.
#
# Por defecto se usa una base H2 en memoria con datos de prueba, para que
# el proyecto funcione sin instalar nada. Para MySQL ver README.md.
# NO escribir aqui la contrasena real de MySQL: usar BR_DB_PASSWORD.
# =====================================================================
db.url=jdbc:h2:mem:bienes_raices;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
db.user=sa
db.password=
db.inicializar=true
